  <script>window.__SHIPSTATIC_STATIC__ = true;</script>
  <script>
    (() => {
      // 【2026-11-14·老板要求】手机端锁定 100%，禁用双指缩放和双击放大。
      document.addEventListener('gesturestart', (event) => event.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', (event) => event.preventDefault(), { passive: false });
      document.addEventListener('gestureend', (event) => event.preventDefault(), { passive: false });
      document.addEventListener('touchmove', (event) => {
        if (event.touches.length > 1) event.preventDefault();
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', (event) => {
        const now = Date.now();
        const interactive = event.target.closest('input,textarea,select,button,a,[contenteditable="true"]');
        if (now - lastTouchEnd <= 320 && !interactive) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      document.addEventListener('wheel', (event) => {
        if (event.ctrlKey) event.preventDefault();
      }, { passive: false });
    })();
  </script>
  <style>

    .arrival-sizes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .arrival-size-chip {
      display: inline-flex; align-items: center; gap: 3px; min-height: 24px;
      padding: 3px 7px; border: 1px solid #d7e8dc; border-radius: 7px;
      background: #f3fbf5; color: #217a3b; font-size: 10px; font-weight: 750;
      font-variant-numeric: tabular-nums;
    }
    .arrival-size-chip.short { border-color: #f0c8c4; background: #fff5f4; color: #b42318; }
    .arrival-list { display: grid; gap: 7px; margin-top: 8px; max-height: 240px; overflow-y: auto; }
    .arrival-event { padding: 8px 9px; border: 1px solid #e3ebf5; border-radius: 9px; background: #fff; }
    .arrival-event-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .arrival-event-time { color: #64748b; font-size: 10.5px; font-weight: 700; }
    .arrival-event-qty { color: #1f4fd8; font-size: 11.5px; font-weight: 850; }
    .arrival-event-source { margin-top: 4px; color: #8a96a8; font-size: 9.5px; }
    .arrival-event-source.counted { color: #15803d; }
    .arrival-event-sizes { margin-top: 4px; color: #536174; font-size: 10px; line-height: 1.55; }
    .sheet-actions {
      flex: 0 0 auto;
      display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      gap: 8px; margin: 0 -16px; padding: 10px 16px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid #e6edf7; background: #fff;
      box-shadow: 0 -8px 24px rgba(15, 23, 42, .08);
    }
    .btn {
      min-width: 0; min-height: 43px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: #fff; color: #475569; font-weight: 750;
    }
    .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    .btn.close-action { padding-left: 10px; padding-right: 10px; }
    .btn:disabled { opacity: .45; }
    .toast {
      position: fixed; left: 50%; bottom: max(24px, calc(env(safe-area-inset-bottom) + 12px));
      z-index: 200; transform: translate(-50%, 16px);
      max-width: calc(100vw - 32px);
      padding: 9px 13px; border-radius: 11px;
      background: #172033; color: #fff; font-size: 12.5px; box-shadow: 0 12px 30px rgba(15,23,42,.25);
      opacity: 0; pointer-events: none; transition: .18s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .site-link {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 34px; padding: 0 11px; border-radius: 999px;
      background: rgba(255,255,255,.16); color: inherit;
      font-size: 12px; font-weight: 700; text-decoration: none;
      border: 1px solid rgba(255,255,255,.24); white-space: nowrap;
    }
    @media (min-width: 560px) {
      .hero { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="hero-row">
        <div>
          <h1>销售排行</h1>
          <div class="hero-sub" id="updated">正在加载数据…</div>
        </div>
        <div class="hero-actions">
          <span class="live-dot" title="数据快照"></span>
          <a class="site-link" href="./profit/index.html">利润测算器</a>
          <button class="icon-btn" id="refresh" title="刷新">⟳</button>
        </div>
      </div>
      <div class="search">
        <span class="ic">⌕</span>
        <input id="q" type="search" autocomplete="off" placeholder="搜索全部货号">
        <button class="clear" id="clear" aria-label="清空搜索">×</button>
      </div>
      <div class="filters" id="filters">
        <button class="filter on" data-filter="all">全部</button>
        <button class="filter" data-filter="warn">库存预警</button>
        <button class="filter" data-filter="need">需补货</button>
        <button class="filter" data-filter="ordered">已下单</button>
      </div>
    </header>

    <div class="summary">
      <span>共 <b id="count">0</b> 款 · 已显示 <b id="visibleCount">0</b></span>
      <span id="sortNote">按桌面版销售排行顺序</span>
    </div>
    <section class="cards" id="cards"></section>
    <div class="load-more-wrap" id="loadMoreWrap" hidden>
      <button class="load-more" id="loadMore" type="button">再显示 20 款</button>
    </div>
  </main>
  <button class="to-top" id="toTop" type="button" aria-label="回到顶部">↑</button>

  <div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="款式详情"></section>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // 2026-11-14 手机同 WiFi 访问：走 8790 的同源代理（8123 只绑本机，手机直连不到；同源也省掉跨域）
    const STATIC_SNAPSHOT = window.__SHIPSTATIC_STATIC__ === true;
    const API = './dashboard.json';
    const LIVE_DASHBOARD_API = '/svc8123/api/sales-rank-mobile';
    const REFRESH_API = '/svc8123/api/restock/refresh';
    // 库存快照超过 5 分钟就自动同步；自动同步每 10 分钟最多触发一次，避免频繁拉快麦触发限流。
    const AUTO_SYNC_STALE_MS = 5 * 60 * 1000;
    const AUTO_SYNC_COOLDOWN_MS = 10 * 60 * 1000;
    // 2026-11-14 老板点名：快麦里这几条是占位脏数据（无主图/已断货/库存 0），按「未备货」处理直接过滤
    const JUNK_NORESTOCK = new Set(['古8', '20197', '古穆齐', '20278坦克', 'GMQ02']);
    const NOTE_KEY = 'zs_sr_note_v1';
    const NOTE_PENDING_KEY = 'zs_sr_note_pending_v1';
    const NOTE_MIGRATED_KEY = 'zs_sr_note_migrated_v1';
    const ORDER_KEY = 'zs_sr_order_v1';
    const ORDER_RECORDS_API = '/svc8123/api/restock/order-records';
    const ORDER_RECORD_API = '/svc8123/api/restock/order-record';
    const RESTOCK_ARRIVALS_API = '/svc8123/api/restock/arrivals';
    const RESTOCK_NOTES_API = '/svc8123/api/restock/notes';
    const RESTOCK_NOTE_API = '/svc8123/api/restock/note';
    const SYNC_ENDPOINT_LOOKUP = 'https://api.github.com/repos/3072863/3072863/contents/sales-rank-endpoint.json?ref=main';
    const API_BASE_KEY = 'zs_sr_api_base_v1';
    const ORDER_TTL_MS = 30 * 86400000;
    const ORDER_AUTO_CLEAR_PERCENT = 90;
    const PAGE_SIZE = 20;
    const AUTO_REFRESH_MS = STATIC_SNAPSHOT ? 5 * 60 * 1000 : 60 * 1000;
    const DAYS_RED = 10, DAYS_ORANGE = 18, DAYS_YELLOW = 30, MIN_STOCK = 10;

    let allItems = [];
    let latestDashboard = null;
    let inventorySyncing = false;
    let lastAutoSyncAttempt = 0;
    let filteredItems = [];
    let currentFilter = 'all';
    let currentCode = '';
    let loading = false;
    let lastDashboardStatus = '正在连接实时数据…';
    let visibleLimit = PAGE_SIZE;
    let lastFilterKey = '';
    let lastRenderSignature = '';
    let defaultSortNote = '按桌面版销售排行顺序';
    const planOverrides = Object.create(null);
    const stockTargets = Object.create(null);
    const restockArrivalCache = Object.create(null);
    const restockArrivalPending = Object.create(null);
    let orderRecords = readJson(ORDER_KEY, {});
    let noteSyncTimer = null;
    let apiBase = '';
    let syncEnabled = !STATIC_SNAPSHOT;
    let syncResolvePromise = null;

    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
    const num = (value) => {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    };
    const fmtInt = (value) => Math.round(num(value)).toLocaleString('zh-CN');
    const fmtMoney = (value) => num(value) > 0
      ? '¥' + (Math.round(num(value) * 100) / 100).toLocaleString('zh-CN')
      : '—';
    const fmtDate = (value) => String(value || '—');

    function readJson(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || 'null');
        return value && typeof value === 'object' ? value : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function saveJson(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (error) {}
    }

    function warnOf(s30, stock, chart, backendWarn, temporarilyNoRestock) {
      const sizes = chart && Array.isArray(chart.sizes) ? chart.sizes : [];
      const plan = sizes.length
        ? sizes.reduce((sum, size) => sum + num(size.plan), 0)
        : num(chart && chart.plan);
      if (temporarilyNoRestock) {
        if (!(s30 > 0)) return { text: '暂不补', level: '' };
        return { text: '暂不补 · 可卖 ' + Math.round(stock / (s30 / 30)) + ' 天', level: '' };
      }
      if (!(s30 > 0)) {
        if (backendWarn) return { text: plan > 0 ? '缺码需补 ' + fmtInt(plan) + ' 双' : '库存需关注', level: 'yellow' };
        return { text: '暂无销量', level: '' };
      }
      const days = stock / (s30 / 30);
      const rounded = Math.round(days);
      if (days <= 0) return { text: '已断货', level: 'red' };
      if (days < DAYS_RED) return { text: '仅够 ' + rounded + ' 天', level: 'red' };
      if (days < DAYS_ORANGE) return { text: '偏紧 ' + rounded + ' 天', level: 'orange' };
      if (days <= DAYS_YELLOW) return { text: '关注 ' + rounded + ' 天', level: 'yellow' };
      if (stock <= MIN_STOCK) return { text: '仅剩 ' + stock + ' 双', level: 'yellow' };
      // 尺码还有缺口时，即使整款总量够卖，也继续保持预警；下单记录不抵扣计划补单。
      if (plan > 0) return { text: '缺码需补 ' + fmtInt(plan) + ' 双', level: 'yellow' };
      // 与后台库存预警中心保持同一名单，避免手机端整款总量算法把在途款提前清掉。
      if (backendWarn) return { text: '库存需关注 ' + rounded + ' 天', level: 'yellow' };
      return { text: '可卖 ' + rounded + ' 天', level: '' };
    }

    function parseItems(sr, restock) {
      const cols = Array.isArray(sr && sr.cols) ? sr.cols : [];
      const iCode = cols.indexOf('货号');
      const i30 = cols.indexOf('近30天发货');
      const iStock = cols.indexOf('仓库库存');
      const iRate = cols.findIndex((name) => String(name).includes('退货率'));
      const unsafe = new Set((sr && sr.norestock || []).map(String));
      const alias = (sr && sr.alias) || {};
      const pics = (sr && sr.pics) || {};
      const chart = (sr && sr.chart) || {};
      const rows = Array.isArray(sr && sr.rows) ? sr.rows : [];
      const restockByCode = new Map((restock && restock.rows || []).map((row) => [String(row[0] ?? ''), row]));

      const items = [];
      let hiddenNamedNorestock = 0;
      rows.forEach((row) => {
        const code = String(row[iCode] ?? '').trim();
        const display = unsafe.has(code) && alias[code] ? String(alias[code]) : code;
        const productName = String(alias[code] || display || code);
        const soldOutNoRestock = [code, display, productName]
          .some(name => String(name || '').includes('卖完不补货'));
        // 商品名称含「未备货」的款直接从手机榜过滤（例：古穆奇 20283-未备货）。
        const junkNorestock = JUNK_NORESTOCK.has(code) || JUNK_NORESTOCK.has(String(alias[code] || ''));
        if (junkNorestock || [code, display, alias[code]].some(name => String(name || '').includes('未备货'))) {
          hiddenNamedNorestock += 1;
          return;
        }
        const s30 = num(row[i30]);
        const stock = num(row[iStock]);
        const rate = row[iRate] == null || row[iRate] === '' ? null : num(row[iRate]);
        const cost = iRate >= 0 ? num(row[iRate + 1]) : 0;
        const created = iRate >= 0 ? row[iRate + 2] : '';
        const ch = chart[code] || null;
        const restockRow = restockByCode.get(code);
        const restockAction = String(restockRow && restockRow[3] || '');
        const temporarilyNoRestock = restockAction.includes('暂不补');
        items.push({
          code,
          display,
          productName,
          soldOutNoRestock,
          pic: pics[code] || pics[display] || '',
          s30,
          stock,
          rate,
          cost,
          created,
          totalAmount: cost > 0 && stock > 0 ? stock * cost : 0,
          warn: warnOf(s30, stock, ch, !!restockRow && !temporarilyNoRestock, temporarilyNoRestock),
          temporarilyNoRestock,
          chart: ch,
          plan: ch && Array.isArray(ch.sizes)
            ? ch.sizes.reduce((sum, size) => sum + num(size.plan), 0)
            : num(ch && ch.plan),
          rank: items.length + 1,
        });
      });
      return { items, hiddenNamedNorestock };
    }

    function picHtml(item, cls = '') {
      if (!item.pic) return '<div class="pic-fallback">暂无<br>主图</div>';
      return '<img class="' + esc(cls) + '" src="' + esc(item.pic) + '" alt="' + esc(item.display) +
        '" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=\'<div class=&quot;pic-fallback&quot;>暂无<br>主图</div>\'">';
    }

    function sizeGridHtml(item) {
      const sizes = item.chart && Array.isArray(item.chart.sizes) ? item.chart.sizes : [];
      if (!sizes.length) return '<div class="empty" style="grid-column:1/-1;padding:10px">暂无尺码数据</div>';
      return sizes.map((size) => {
        const stock = num(size.stock);
        const stockClass = stock < 0 ? 'neg' : (stock === 0 ? 'zero' : (stock <= 3 ? 'low' : ''));
        const plan = num(size.plan);
        return '<div class="size">' +
          '<div class="size-s">' + esc(size.s) + '</div>' +
          '<div class="size-stock ' + stockClass + '">' + fmtInt(stock) + '</div>' +
          '<div class="size-plan">' + (plan > 0 ? '补 ' + fmtInt(plan) : '') + '</div>' +
        '</div>';
      }).join('');
    }

    function matchesFilter(item) {
      if ((currentFilter === 'warn' || currentFilter === 'need') && item.soldOutNoRestock) return false;
      if ((currentFilter === 'warn' || currentFilter === 'need') && item.temporarilyNoRestock) return false;
      if (currentFilter === 'warn') return !!item.warn.level && num(item.plan) < 20;
      if (currentFilter === 'need') return !!item.warn.level && num(item.plan) >= 20 && !orderRecordOf(item.code);
      if (currentFilter === 'ordered') return Boolean(orderRecordOf(item.code));
      return true;
    }

    function sortItemsBySuggestedPlan(items) {
      return items
        .map((item, index) => ({ item, index }))
        .sort((a, b) => {
          const diff = num(b.item.plan) - num(a.item.plan);
          return diff || a.index - b.index;
        })
        .map((entry) => entry.item);
    }

    function selectFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter').forEach((node) => {
        node.classList.toggle('on', node.dataset.filter === filter);
      });
    }

    function applyFilter() {
      const query = $('q').value.trim().toLowerCase();
      const searching = Boolean(query);
      if (searching && currentFilter !== 'all') selectFilter('all');
      $('clear').style.display = query ? 'block' : 'none';
      const filterKey = currentFilter + '\n' + query;
      if (filterKey !== lastFilterKey) {
        visibleLimit = PAGE_SIZE;
        lastFilterKey = filterKey;
      }
      filteredItems = allItems.filter((item) => {
        if (!searching) return matchesFilter(item);
        return item.code.toLowerCase().includes(query) ||
          item.display.toLowerCase().includes(query);
      });
      const sortBySuggestedPlan = !searching &&
        (currentFilter === 'warn' || currentFilter === 'need');
      if (sortBySuggestedPlan) {
        filteredItems = sortItemsBySuggestedPlan(filteredItems);
      }
      $('sortNote').textContent = currentFilter === 'warn'
        ? '计划补单 <20 双 · 按数量从多到少'
        : (currentFilter === 'need'
          ? '计划补单 ≥20 双 · 已下单不在本页 · 按数量从多到少'
          : (currentFilter === 'ordered'
            ? '已下单、工厂未送达 · 按销售排行顺序'
            : defaultSortNote));
      renderCards();
    }

    function renderCards() {
      $('count').textContent = filteredItems.length;
      const box = $('cards');
      box.classList.toggle('loading', loading);
      if (!filteredItems.length) {
        $('visibleCount').textContent = '0';
        $('loadMoreWrap').hidden = true;
        box.innerHTML = loading
          ? '<div class="empty"><div class="big">⏳</div>正在加载销售排行…</div>'
          : '<div class="empty"><div class="big">🔍</div>没有符合条件的款式</div>';
        return;
      }
      const visibleItems = filteredItems.slice(0, visibleLimit);
      const remaining = Math.max(0, filteredItems.length - visibleItems.length);
      $('visibleCount').textContent = visibleItems.length;
      $('loadMoreWrap').hidden = remaining === 0;
      if (remaining > 0) {
        $('loadMore').innerHTML = '再显示 ' + Math.min(PAGE_SIZE, remaining) + ' 款' +
          '<small>还剩 ' + remaining + ' 款</small>';
      }
      box.innerHTML = visibleItems.map((item) => {
        const warnTag = item.warn.level
          ? '<span class="tag ' + esc(item.warn.level) + '">' + esc(item.warn.text) + '</span>'
          : '<span class="tag green">' + esc(item.warn.text) + '</span>';
        const alias = item.display !== item.code
          ? '<div class="alias">' + esc(item.display) + '</div>'
          : '';
        const adjustedPlan = planTotalOf(item);
        const planTag = adjustedPlan > 0
          ? '<span class="tag orange">计划补单 ' + fmtInt(adjustedPlan) + '</span>'
          : '';
        const orderRecord = orderRecordOf(item.code);
        const orderTag = orderRecord
          ? '<span class="tag green">已下单 · 未到货 ' + fmtInt(orderRemainingOf(item.code)) + ' 双</span>'
          : '';
        const shipTag = '<span class="tag ship">30天已发 ' + fmtInt(item.s30) + ' 双</span>';
        return '<article class="sr-card" data-code="' + esc(item.code) + '" tabindex="0" role="button" aria-label="查看 ' + esc(item.code) + ' 详情">' +
          '<div class="rank">#' + item.rank + '</div>' +
          '<div class="pic-box">' + picHtml(item) + '</div>' +
          '<div class="head"><div class="code">' + esc(item.code) + '</div>' + alias +
            '<div class="tag-row">' + shipTag + warnTag + planTag + orderTag + '</div>' +
          '</div>' +
          '<div class="sizes">' + sizeGridHtml(item) + '</div>' +
          '<div class="more"><span>总库存 <b>' + fmtInt(item.stock) + ' 双</b> · 补 = 计划补单</span><strong>点开看全部 ›</strong></div>' +
        '</article>';
      }).join('');
    }

    function noteOf(code) {
      return String(readJson(NOTE_KEY, {})[code] || '');
    }

    function serviceUrl(path) {
      return apiBase ? apiBase + path : path;
    }

    async function fetchWithTimeout(url, options = {}, timeout = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    function decodeBase64Utf8(value) {
      const binary = atob(String(value || '').replace(/\s/g, ''));
      const bytes = Uint8Array.from(binary, (ch) => ch.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    async function checkApiBase(base) {
      if (!/^https:\/\/[^/]+/i.test(base)) return false;
      try {
        const response = await fetchWithTimeout(base + '/svc8123/health', { cache: 'no-store' }, 6000);
        return response.ok;
      } catch (error) {
        return false;
      }
    }

    async function resolveSyncBase(force = false) {
      if (!STATIC_SNAPSHOT) {
        syncEnabled = true;
        return true;
      }
      if (syncEnabled && !force) return true;
      if (syncResolvePromise) return syncResolvePromise;
      syncResolvePromise = (async () => {
        const candidates = [];
        try {
          const response = await fetchWithTimeout(SYNC_ENDPOINT_LOOKUP, {
            cache: 'no-store',
            headers: { Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const result = await response.json();
          const endpoint = JSON.parse(decodeBase64Utf8(result.content || ''));
          const remote = String(endpoint.api_base || '').replace(/\/+$/, '');
          if (remote) candidates.push(remote);
        } catch (error) {}
        // GitHub 是公网地址的唯一来源；本地缓存只作为接口临时不可读时的兜底。
        const cached = String(localStorage.getItem(API_BASE_KEY) || '').replace(/\/+$/, '');
        if (cached && !candidates.includes(cached)) candidates.push(cached);
        for (const candidate of candidates) {
          if (await checkApiBase(candidate)) {
            apiBase = candidate;
            syncEnabled = true;
            localStorage.setItem(API_BASE_KEY, candidate);
            return true;
          }
        }
        apiBase = '';
        syncEnabled = false;
        return false;
      })();
      try {
        return await syncResolvePromise;
      } finally {
        syncResolvePromise = null;
      }
    }

    function noteStatus(message, state = '') {
      const node = $('noteStatus');
      if (!node) return;
      node.textContent = message;
      node.className = 'note-status' + (state ? ' ' + state : '');
    }

    function setPendingNote(code, text) {
      const pending = readJson(NOTE_PENDING_KEY, {});
      if (text) pending[code] = text;
      else delete pending[code];
      saveJson(NOTE_PENDING_KEY, pending);
    }

    async function postRestockNote(code, text) {
        const response = await fetch(serviceUrl(RESTOCK_NOTE_API), {
        method: 'POST',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, text }),
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const result = await response.json();
      if (!result || result.success === false) {
        throw new Error(result && result.msg || '保存给工厂备注失败');
      }
      setPendingNote(code, '');
      return String(result.text || '');
    }

    function queueRestockNote(code, text) {
      if (!syncEnabled) {
        noteStatus('共享服务暂不可用：仅本机', 'error');
        return;
      }
      setPendingNote(code, text);
      noteStatus('正在同步…');
      clearTimeout(noteSyncTimer);
      noteSyncTimer = setTimeout(async () => {
        try {
          await postRestockNote(code, text);
          if (currentCode === code) noteStatus('已同步到服务器', 'ok');
        } catch (error) {
          if (currentCode === code) noteStatus('服务器暂不可用，已留在本机', 'error');
        }
      }, 350);
    }

    async function fetchRestockNotes() {
      const local = readJson(NOTE_KEY, {});
      if (!syncEnabled) return local;
      try {
        const response = await fetch(serviceUrl(RESTOCK_NOTES_API), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const result = await response.json();
        if (!result || result.success === false) {
          throw new Error(result && result.msg || '读取给工厂备注失败');
        }
        const remote = result.notes && typeof result.notes === 'object' ? result.notes : {};
        const pending = readJson(NOTE_PENDING_KEY, {});
        const source = result.initialized === false ? local : remote;
        const notes = {};
        Object.entries(source).forEach(([code, value]) => {
          const text = String(value || '').trim().slice(0, 1000);
          if (code && text) notes[code] = text;
        });
        const needsMigration = localStorage.getItem(NOTE_MIGRATED_KEY) !== '1';
        if (result.initialized === false || needsMigration) {
          Object.keys(local).forEach((code) => setPendingNote(code, String(local[code] || '')));
          localStorage.setItem(NOTE_MIGRATED_KEY, '1');
        } else {
          Object.entries(pending).forEach(([code, value]) => {
            const text = String(value || '').trim().slice(0, 1000);
            if (code && text) notes[code] = text;
          });
        }
        saveJson(NOTE_KEY, notes);
        Object.entries(readJson(NOTE_PENDING_KEY, {})).forEach(([code, text]) => {
          postRestockNote(code, text).catch(() => {});
        });
        return notes;
      } catch (error) {
        return local;
      }
    }

    function orderTimeText(timestamp) {
      const date = new Date(num(timestamp));
      const pad = (value) => String(value).padStart(2, '0');
      return pad(date.getMonth() + 1) + '-' + pad(date.getDate()) +
        ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
    }

    function normaliseOrderSizes(sizes) {
      const out = [];
      const seen = new Set();
      (Array.isArray(sizes) ? sizes : []).forEach((item) => {
        const size = String(item && (item.s || item.size) || '').trim();
        const qty = Math.round(num(item && (item.q ?? item.plan)));
        if (size && qty > 0 && !seen.has(size)) {
          seen.add(size);
          out.push({ s: size, q: qty });
        }
      });
      return out;
    }

    function orderEntryText(code, entry) {
      if (entry && entry.text) return String(entry.text);
      const lines = [new Date(num(entry && entry.t) || Date.now()).toLocaleDateString('zh-CN')];
      if (entry && entry.note) lines.push('给工厂备注：' + entry.note);
      lines.push('下单货号：' + code + '（合计 ' + fmtInt(entry && entry.q) + '双）');
      (entry && entry.sizes || []).forEach((size) => {
        lines.push(size.s + '码 ' + fmtInt(size.q) + '双');
      });
      return lines.join('\n');
    }

    function orderRecordStatusText(code, entries) {
      const state = restockArrivalCache[code];
      const progress = state && state.progress;
      if (arrivalReachedAutoClear(progress)) {
        return '到货量已达 ' + ORDER_AUTO_CLEAR_PERCENT + '% · 自动移出';
      }
      if (progress && num(progress.needed_qty) > 0) {
        const remaining = Math.max(0, num(progress.remaining_qty));
        const arrived = Math.max(0, num(progress.needed_qty) - remaining);
        if (remaining > 0) {
          return (arrived > 0 ? '部分到货' : '待工厂到货') +
            ' · 未到货 ' + fmtInt(remaining) + ' 双' +
            (progress.remaining_text ? ' · ' + progress.remaining_text : '');
        }
        return '全部尺码已到齐';
      }
      const latest = entries[0] || null;
      return latest
        ? '待工厂到货 · 共 ' + entries.length + ' 次 · 最近 ' + fmtInt(latest.q) + ' 双'
        : '暂无记录';
    }

    function arrivalSizeText(sizes) {
      return (Array.isArray(sizes) ? sizes : [])
        .map((size) => String(size.s || '') + '码 ' + fmtInt(size.q) + '双')
        .join(' · ');
    }

    function restockArrivalBoxHtml(code) {
      const state = restockArrivalCache[code];
      const progress = state && state.progress || null;
      const autoClear = arrivalReachedAutoClear(progress);
      // 只展示真正参与补货冲减的机器人入库；牛马售后等普通/退货入库只留在后台记录里。
      const arrivals = state && Array.isArray(state.arrivals)
        ? state.arrivals.filter((event) => event && event.counted === true)
        : [];
      let status = '正在读取到货记录…';
      let statusClass = '';
      let summary = '<div class="arrival-summary">按尺码逐双冲减，全部减到 0 后才自动移出。</div>';

      if (!syncEnabled) {
        status = '共享服务未连接';
        summary = '<div class="arrival-summary">当前只能看到本机记录，暂时无法读取服务器到货明细。</div>';
      } else if (autoClear) {
        status = '到货量已达 ' + ORDER_AUTO_CLEAR_PERCENT + '% · 自动移出';
        summary = '<div class="arrival-summary">机器人有效到货总量已达到下单量 ' +
          ORDER_AUTO_CLEAR_PERCENT + '%，已下单记录已自动移出。</div>';
      } else if (progress && num(progress.needed_qty) > 0) {
        const remaining = Math.max(0, num(progress.remaining_qty));
        if (remaining > 0) {
          status = '未到货 ' + fmtInt(remaining) + ' 双';
          statusClass = ' warn';
        } else {
          status = '全部尺码已到齐';
        }
        summary = '<div class="arrival-summary">' +
          (remaining > 0
            ? '按尺码逐双冲减：<span class="short">' +
              esc(progress.remaining_text || progress.shortage_text || '') +
              '</span>，订单继续保留。'
            : '所有计划尺码已冲减到 0，订单自动移出。') +
          '</div>';
      } else if (!restockArrivalPending[code] && state) {
        status = '暂无到货记录';
      }

      const sizeChips = progress && Array.isArray(progress.sizes) && progress.sizes.length
        ? '<div class="arrival-sizes">' + progress.sizes.map((size) => (
            '<span class="arrival-size-chip' + (size.ok ? '' : ' short') + '">' +
              esc(size.s) + '码 ' + fmtInt(size.arrived) + '/' + fmtInt(size.needed) +
              (size.ok ? '' : ' · 未到' + fmtInt(size.shortage)) +
            '</span>'
          )).join('') + '</div>'
        : '';
      const eventHtml = arrivals.length
        ? '<div class="arrival-list">' + arrivals.map((event) => (
            '<div class="arrival-event">' +
              '<div class="arrival-event-head">' +
                '<span class="arrival-event-time">' + esc(event.time || '') + '</span>' +
                '<span class="arrival-event-qty">到货 ' + fmtInt(event.qty) + ' 双</span>' +
              '</div>' +
              '<div class="arrival-event-source counted">' +
                esc(event.source_label || '机器人入库 · 参与核销') +
              '</div>' +
              '<div class="arrival-event-sizes">' + esc(arrivalSizeText(event.sizes) || '—') + '</div>' +
            '</div>'
          )).join('') + '</div>'
        : '';

      return '<div class="arrival-record" id="arrivalRecordBox">' +
        '<div class="arrival-record-top">' +
          '<span class="arrival-record-title">到货记录</span>' +
          '<strong class="arrival-record-status' + statusClass + '">' + esc(status) + '</strong>' +
        '</div>' + summary + sizeChips + eventHtml +
      '</div>';
    }

    async function fetchRestockArrivalProgress(code) {
      if (!syncEnabled || !orderEntriesOf(code).length || restockArrivalPending[code]) return;
      restockArrivalPending[code] = true;
      if (currentCode === code) refreshOrderRecordBox(code, false);
      try {
        const response = await fetch(
          serviceUrl(RESTOCK_ARRIVALS_API + '?code=' + encodeURIComponent(code)),
          { cache: 'no-store' },
        );
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const result = await response.json();
        if (!result || result.success === false) {
          throw new Error(result && result.msg || '读取到货记录失败');
        }
        restockArrivalCache[code] = result;
      } catch (error) {
        delete restockArrivalCache[code];
      } finally {
        delete restockArrivalPending[code];
        if (currentCode === code) {
          refreshTargetPlanView(code);
          refreshOrderRecordBox(code, false);
        }
      }
    }

    function normaliseOrderEntry(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const q = Math.round(num(raw.q));
      const t = Math.round(num(raw.t));
      if (!(q > 0) || !(t > 0)) return null;
      return {
        id: String(raw.id || ('legacy-' + t + '-' + q)),
        q,
        t,
        text: String(raw.text || '').slice(0, 4000),
        note: String(raw.note || '').slice(0, 300),
        sizes: normaliseOrderSizes(raw.sizes),
      };
    }

    function buildOrderRecord(entries, revision) {
      const ordered = entries
        .map(normaliseOrderEntry)
        .filter(Boolean)
        .sort((a, b) => a.t - b.t)
        .slice(-20);
      if (!ordered.length) {
        return {
          q: 0, t: 0, rev: Math.round(num(revision) || Date.now()),
          text: '', note: '', sizes: [], entries: [],
        };
      }
      const latest = ordered[ordered.length - 1];
      return {
        q: latest.q,
        t: latest.t,
        rev: Math.max(Math.round(num(revision)), latest.t),
        text: latest.text,
        note: latest.note,
        sizes: latest.sizes,
        entries: ordered,
      };
    }

    function normaliseOrderRecord(value) {
      if (!value || typeof value !== 'object') return null;
      let rawEntries = Array.isArray(value.entries) ? value.entries : [];
      if (!rawEntries.length && num(value.q) > 0 && num(value.t) > 0) rawEntries = [value];
      const entries = rawEntries.map(normaliseOrderEntry).filter(Boolean);
      const revision = Math.round(num(value.rev) || num(value.t));
      if (entries.length) return buildOrderRecord(entries, revision);
      if (revision > 0) return buildOrderRecord([], revision);
      return null;
    }

    function orderRecordValue(code) {
      return normaliseOrderRecord(orderRecords[String(code || '').trim()]);
    }

    function orderEntriesOf(code) {
      const record = orderRecordValue(code);
      if (!record) return [];
      return record.entries
        .filter((entry) => Date.now() - entry.t <= ORDER_TTL_MS)
        .sort((a, b) => a.t - b.t);
    }

    function arrivalReachedAutoClear(progress) {
      const needed = num(progress && progress.needed_qty);
      if (needed <= 0) return false;
      if (progress.complete === true || progress.auto_clear === true) return true;
      const arrived = Math.max(num(progress.counted_qty), num(progress.fulfilled_qty));
      return arrived * 100 >= needed * ORDER_AUTO_CLEAR_PERCENT;
    }

    function orderRecordOf(code) {
      const state = restockArrivalCache[code];
      if (arrivalReachedAutoClear(state && state.progress)) return null;
      const entries = orderEntriesOf(code);
      if (!entries.length) return null;
      return buildOrderRecord(entries, entries[entries.length - 1].t);
    }

    function orderRemainingOf(code) {
      const state = restockArrivalCache[code];
      const progress = state && state.progress;
      if (progress && num(progress.needed_qty) > 0) {
        return Math.max(0, num(progress.remaining_qty));
      }
      const record = orderRecordOf(code);
      return record ? Math.max(0, num(record.q)) : 0;
    }

    function orderOf(code) {
      const record = orderRecordOf(code);
      return record ? record.q : 0;
    }

    function mergeOrderRecords(remote) {
      const merged = { ...orderRecords };
      const pendingUpload = [];
      const pendingDelete = [];
      const now = Date.now();
      Object.entries(remote || {}).forEach(([code, value]) => {
        const key = String(code || '').trim();
        const record = normaliseOrderRecord(value);
        if (!key || !record) return;
        const current = normaliseOrderRecord(merged[key]);
        if (!current || record.rev >= current.rev) merged[key] = record;
      });
      Object.entries(merged).forEach(([code, value]) => {
        const record = normaliseOrderRecord(value);
        if (!record || !(record.rev > 0) || now - record.rev > ORDER_TTL_MS) {
          delete merged[code];
          return;
        }
        const serverRecord = normaliseOrderRecord(remote && remote[code]);
        if (!serverRecord || record.rev > serverRecord.rev) {
          if (record.entries.length) {
            pendingUpload.push({ code, entry: record.entries[record.entries.length - 1] });
          } else {
            pendingDelete.push(code);
          }
        }
      });
      orderRecords = merged;
      saveJson(ORDER_KEY, orderRecords);
      pendingUpload.forEach((payload) => postOrderRecord(payload).catch(() => {}));
      pendingDelete.forEach((code) => deleteOrderRecordRemote(code).catch(() => {}));
    }

    async function fetchOrderRecords() {
      if (!syncEnabled) return orderRecords;
      try {
        const response = await fetch(serviceUrl(ORDER_RECORDS_API), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const result = await response.json();
        if (!result || result.success === false) throw new Error(result && result.msg || '读取补货记录失败');
        mergeOrderRecords(result.records);
        applyRestockArrivalProgressMap(result.arrival_progress);
      } catch (error) {
        // 8123 暂时不可用时保留本机兜底记录，不阻塞销售榜显示。
      }
      return orderRecords;
    }

    function applyRestockArrivalProgressMap(progressMap) {
      if (!progressMap || typeof progressMap !== 'object') return;
      Object.entries(progressMap).forEach(([code, progress]) => {
        if (!code || !progress || typeof progress !== 'object') return;
        const current = restockArrivalCache[code] || {};
        restockArrivalCache[code] = { ...current, progress };
      });
    }

    async function postOrderRecord(payload) {
      const response = await fetch(serviceUrl(ORDER_RECORD_API), {
        method: 'POST',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const result = await response.json();
      if (!result || result.success === false) throw new Error(result && result.msg || '保存补货记录失败');
      return normaliseOrderRecord(result.record);
    }

    function saveOrderRecordLocal(code, total, details) {
      const key = String(code || '').trim();
      if (!key || !(total > 0)) return null;
      const stamp = Date.now();
      const entry = normaliseOrderEntry({
        id: stamp + '-' + String(Math.floor(Math.random() * 1000000)).padStart(6, '0'),
        q: total,
        t: stamp,
        text: details && details.text,
        note: details && details.note,
        sizes: details && details.sizes,
      });
      const entries = [...orderEntriesOf(key), entry];
      const record = buildOrderRecord(entries, stamp);
      orderRecords[key] = record;
      saveJson(ORDER_KEY, orderRecords);
      return { record, entry };
    }

    async function saveOrderRecord(code, total, details) {
      const local = saveOrderRecordLocal(code, total, details);
      if (!local) return null;
      if (!syncEnabled) return local.record;
      const serverRecord = await postOrderRecord({ code, entry: local.entry });
      if (serverRecord) orderRecords[code] = serverRecord;
      saveJson(ORDER_KEY, orderRecords);
      return serverRecord || local.record;
    }

    async function deleteOrderRecordRemote(code, entryId = '') {
      if (!syncEnabled) return orderRecords[code] || null;
      const serverRecord = await postOrderRecord({
        code,
        action: 'delete_entry',
        entry_id: entryId,
      });
      if (serverRecord) orderRecords[code] = serverRecord;
      else orderRecords[code] = buildOrderRecord([], Date.now());
      saveJson(ORDER_KEY, orderRecords);
      return orderRecords[code];
    }

    async function deleteOrderRecordEntry(code, entryId) {
      const key = String(code || '').trim();
      const entry = orderEntriesOf(key).find((item) => item.id === entryId);
      if (!entry) return null;
      const record = buildOrderRecord(
        orderEntriesOf(key).filter((item) => item.id !== entryId),
        Date.now(),
      );
      orderRecords[key] = record;
      saveJson(ORDER_KEY, orderRecords);
      return deleteOrderRecordRemote(key, entryId);
    }

    function orderRecordBoxHtml(code) {
      const entries = orderEntriesOf(code).slice().reverse();
      const progress = restockArrivalCache[code] && restockArrivalCache[code].progress || null;
      const autoCleared = arrivalReachedAutoClear(progress);
      const remainingQty = progress && num(progress.needed_qty) > 0
        ? Math.max(0, num(progress.remaining_qty))
        : 0;
      const pendingArrival = Boolean(
        progress &&
        num(progress.fulfilled_qty) > 0 &&
        remainingQty > 0
      );
      const status = orderRecordStatusText(code, entries);
      const statusWarn = !!(restockArrivalCache[code] &&
        restockArrivalCache[code].progress &&
        restockArrivalCache[code].progress.shortage_text);
      const pendingText = progress
        ? '未到货：' + fmtInt(remainingQty) + ' 双' +
          ((progress.sizes || [])
            .filter((size) => num(size.shortage) > 0)
            .map((size) => '\n' + size.s + '码 ' + fmtInt(size.shortage) + ' 双')
            .join(''))
        : '';
      const pendingBody = '<div class="order-record-list">' +
        '<div class="order-record-item pending-arrival">' +
          '<div class="order-record-item-head">' +
            '<div class="order-record-item-meta">到货后剩余 <b>' +
              fmtInt(remainingQty) + ' 双</b></div>' +
          '</div>' +
          '<pre class="order-record-text">' + esc(pendingText) + '</pre>' +
          '<div class="order-record-time">已到货部分已自动冲减；到齐后这条剩余记录自动清除。</div>' +
        '</div>' +
      '</div>';
      const autoClearedBody = '<div class="order-record-list">' +
        '<div class="order-record-item pending-arrival">' +
          '<div class="order-record-item-head">' +
            '<div class="order-record-item-meta">到货量已达到下单量 <b>' +
              ORDER_AUTO_CLEAR_PERCENT + '%</b></div>' +
          '</div>' +
          '<div class="order-record-time">已下单记录已自动移出。</div>' +
        '</div>' +
      '</div>';
      const body = autoCleared
        ? autoClearedBody
        : pendingArrival
        ? pendingBody
        : entries.length
        ? '<div class="order-record-list">' + entries.map((entry) => (
            '<div class="order-record-item" data-order-id="' + esc(entry.id) + '">' +
              '<div class="order-record-item-head">' +
                '<div class="order-record-item-meta">' + esc(orderTimeText(entry.t)) +
                  '<b>' + fmtInt(entry.q) + ' 双</b></div>' +
                '<div class="order-record-item-actions">' +
                  '<button type="button" class="order-record-btn" data-order-copy="1">复制图文</button>' +
                  '<button type="button" class="order-record-btn danger" data-order-delete="1">删除</button>' +
                '</div>' +
              '</div>' +
              '<pre class="order-record-text">' + esc(orderEntryText(code, entry)) + '</pre>' +
            '</div>'
          )).join('') + '</div>'
        : '<div class="order-record-time">复制补货后会在这里自动记为已下单；大货入库后自动移出，未入库记录 30 天后自动清空。</div>';
      return '<div class="order-record-box" id="orderRecordBox">' +
        '<div class="order-record-top">' +
          '<span class="order-record-title">' +
            (autoCleared ? '补货已结束' : pendingArrival ? '剩余未到货' : '已下单记录') + '</span>' +
          '<strong class="order-record-status' + (statusWarn ? ' warn' : '') +
            '" id="orderRecordStatus">' + esc(status) + '</strong>' +
        '</div>' + body + restockArrivalBoxHtml(code) +
      '</div>';
    }

    function bindOrderRecordBox(code) {
      const box = $('orderRecordBox');
      if (!box) return;
      box.querySelectorAll('.order-record-item').forEach((node) => {
        const entryId = node.dataset.orderId;
        const entry = orderEntriesOf(code).find((item) => item.id === entryId);
        const copyBtn = node.querySelector('[data-order-copy]');
        const deleteBtn = node.querySelector('[data-order-delete]');
        if (copyBtn && entry) {
          copyBtn.addEventListener('click', () => {
            copyOrderCardToClipboard(code, orderEntryText(code, entry))
              .then((copyMode) => showToast(copyMode === 'richHtml' || copyMode === 'rich' || copyMode === 'imageText'
                ? '已复制图片和文字，请粘贴查看'
                : (copyMode === 'image'
                  ? '当前浏览器不支持图文同粘，已复制商品图'
                  : '已复制补货文字')))
              .catch(() => showToast('复制失败，请长按记录文字手动复制'));
          });
        }
        if (deleteBtn && entry) {
          deleteBtn.addEventListener('click', async () => {
            if (!window.confirm('确定删除这条补货记录吗？\n\n' + orderEntryText(code, entry))) return;
            deleteBtn.disabled = true;
            try {
              await deleteOrderRecordEntry(code, entryId);
              refreshOrderRecordBox(code);
              renderCards();
              showToast('已删除这条补货记录');
            } catch (error) {
              deleteBtn.disabled = false;
              showToast('删除失败，请稍后重试');
            }
          });
        }
      });
    }

    function refreshOrderRecordBox(code, scroll = true) {
      const box = $('orderRecordBox');
      if (!box) return;
      box.outerHTML = orderRecordBoxHtml(code);
      bindOrderRecordBox(code);
      if (scroll) requestAnimationFrame(() => {
        const next = $('orderRecordBox');
        if (next) next.scrollIntoView({ block: 'center', behavior: 'smooth' });
      });
    }

    function planOverridesOf(code) {
      const value = planOverrides[code];
      return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
    }

    function planOf(code, size, suggested) {
      const overrides = planOverridesOf(code);
      return Object.prototype.hasOwnProperty.call(overrides, size) ? num(overrides[size]) : num(suggested);
    }

    function planTotalOf(item) {
      const sizes = item.chart && Array.isArray(item.chart.sizes) ? item.chart.sizes : [];
      const overrides = planOverridesOf(item.code);
      const targetPlans = targetPlansOf(item);
      if (!Object.keys(overrides).length && !targetPlans) return num(item.plan);
      return sizes.reduce((sum, size) =>
        sum + planOf(item.code, String(size.s), targetBasePlan(item, size, targetPlans)), 0);
    }

    function savePlanOverride(code, size, value, suggested) {
      const record = planOverrides[code] && typeof planOverrides[code] === 'object'
        ? { ...planOverrides[code] }
        : {};
      if (num(value) === num(suggested)) delete record[size];
      else record[size] = Math.max(0, Math.round(num(value)));
      if (Object.keys(record).length) planOverrides[code] = record;
      else delete planOverrides[code];
    }

    function clearPlanOverrides(code) {
      delete planOverrides[code];
    }

    function restoreDefaultPlans(code, item) {
      delete stockTargets[code];
      clearPlanOverrides(code);
      const targetInput = $('stockTarget');
      if (targetInput) targetInput.value = '';
      const host = $('sizeTableHost');
      if (host) host.innerHTML = sizeTableHtml(item);
      bindPlanInputsForDetail(item);
    }

    function unarrivedBySizeOf(item) {
      const out = {};
      const state = restockArrivalCache[item.code];
      const progress = state && state.progress;
      if (progress && num(progress.needed_qty) > 0 &&
          Array.isArray(progress.sizes) && progress.sizes.length) {
        progress.sizes.forEach((size) => {
          const key = String(size && size.s || '').trim();
          if (key) out[key] = Math.max(0, num(size.shortage));
        });
        return out;
      }
      orderEntriesOf(item.code).forEach((entry) => {
        (entry.sizes || []).forEach((size) => {
          const key = String(size && size.s || '').trim();
          if (key) out[key] = (out[key] || 0) + Math.max(0, num(size.q));
        });
      });
      return out;
    }

    // 目标量先按销量占比分到各码，再扣该码实际库存和尚未到货的上次下单量。
    function targetPlansOf(item) {
      const target = Math.max(0, Math.round(num(stockTargets[item.code])));
      const sizes = item.chart && Array.isArray(item.chart.sizes) ? item.chart.sizes : [];
      if (!(target > 0) || !sizes.length) return null;
      const weights = sizes.map((size) => Math.max(0, num(size.n)));
      if (!weights.some((weight) => weight > 0)) weights.fill(1);
      const weightSum = weights.reduce((sum, weight) => sum + weight, 0);
      const raw = weights.map((weight) => target * weight / weightSum);
      const allocated = raw.map((value) => Math.floor(value));
      let left = target - allocated.reduce((sum, value) => sum + value, 0);
      const order = raw
        .map((value, index) => ({ index, remainder: value - allocated[index], weight: weights[index] }))
        .sort((a, b) => b.remainder - a.remainder || b.weight - a.weight || a.index - b.index);
      let cursor = 0;
      while (left > 0 && order.length) {
        allocated[order[cursor % order.length].index] += 1;
        left -= 1;
        cursor += 1;
      }
      const pending = unarrivedBySizeOf(item);
      const plans = {};
      sizes.forEach((size, index) => {
        const key = String(size.s);
        plans[key] = Math.max(0, allocated[index] - num(size.stock) - num(pending[key]));
      });
      return plans;
    }

    function targetBasePlan(item, size, targetPlans) {
      const key = String(size.s);
      return targetPlans
        ? num(targetPlans[key])
        : num(size.plan);
    }

    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise((resolve, reject) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy') ? resolve() : reject(new Error('copy failed'));
        } catch (error) {
          reject(error);
        } finally {
          textarea.remove();
        }
      });
    }

    function orderCardImageUrl(url) {
      const raw = String(url || '').trim();
      if (!raw) return '';
      if (/^(data|blob):/i.test(raw)) return raw;
      try {
        const parsed = new URL(raw, location.href);
        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return '';
        const source = parsed.href.replace(/^https?:\/\//i, '');
        return 'https://images.weserv.nl/?url=' + encodeURIComponent(source) +
          '&w=920&h=720&fit=inside&output=jpg';
      } catch (error) {
        return '';
      }
    }

    function loadOrderCardImage(url) {
      const source = orderCardImageUrl(url);
      if (!source) return Promise.resolve(null);
      return new Promise((resolve) => {
        const image = new Image();
        let settled = false;
        const finish = (value) => {
          if (settled) return;
          settled = true;
          resolve(value);
        };
        image.crossOrigin = 'anonymous';
        image.onload = () => finish(image);
        image.onerror = () => finish(null);
        image.src = source;
        setTimeout(() => finish(null), 12000);
      });
    }

    function roundedCanvasRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function canvasTextLines(ctx, text, maxWidth) {
      const lines = [];
      String(text || '').split(/\r?\n/).forEach((paragraph) => {
        if (!paragraph) {
          lines.push('');
          return;
        }
        let line = '';
        Array.from(paragraph).forEach((char) => {
          const next = line + char;
          if (line && ctx.measureText(next).width > maxWidth) {
            lines.push(line);
            line = char;
          } else {
            line = next;
          }
        });
        if (line) lines.push(line);
      });
      return lines;
    }

    async function buildOrderCardBlob(code, text) {
      const item = allItems.find((candidate) =>
        String(candidate.code || '').trim() === String(code || '').trim()) || null;
      const image = await loadOrderCardImage(item && item.pic);
      const width = 1080;
      const outer = 44;
      const cardX = outer;
      const cardY = outer;
      const cardW = width - outer * 2;
      const pad = 36;
      const imageW = cardW - pad * 2;
      const imageH = 640;
      const titleGap = 70;
      const titleSize = 56;
      const bodySize = 34;
      const bodyLineHeight = 54;
      const bodyTopGap = 38;
      const footerH = 70;

      const measureCanvas = document.createElement('canvas');
      const measureCtx = measureCanvas.getContext('2d');
      measureCtx.font = '500 ' + bodySize + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
      const bodyLines = canvasTextLines(measureCtx, text, imageW);
      const cardH = pad + imageH + titleGap + titleSize + bodyTopGap +
        bodyLines.length * bodyLineHeight + footerH + pad;
      const height = cardY + cardH + outer;
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#eef3f8';
      ctx.fillRect(0, 0, width, height);
      ctx.save();
      ctx.shadowColor = 'rgba(28, 47, 79, .12)';
      ctx.shadowBlur = 28;
      ctx.shadowOffsetY = 12;
      ctx.fillStyle = '#ffffff';
      roundedCanvasRect(ctx, cardX, cardY, cardW, cardH, 32);
      ctx.fill();
      ctx.restore();

      const imageX = cardX + pad;
      const imageY = cardY + pad;
      ctx.fillStyle = '#f8fafc';
      roundedCanvasRect(ctx, imageX, imageY, imageW, imageH, 24);
      ctx.fill();
      ctx.save();
      roundedCanvasRect(ctx, imageX, imageY, imageW, imageH, 24);
      ctx.clip();
      if (image) {
        const scale = Math.min(imageW / image.naturalWidth, imageH / image.naturalHeight);
        const drawW = image.naturalWidth * scale;
        const drawH = image.naturalHeight * scale;
        ctx.drawImage(
          image,
          imageX + (imageW - drawW) / 2,
          imageY + (imageH - drawH) / 2,
          drawW,
          drawH,
        );
      } else {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 34px "Microsoft YaHei", "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('商品图暂时无法加载', imageX + imageW / 2, imageY + imageH / 2);
      }
      ctx.restore();

      const titleY = imageY + imageH + titleGap;
      ctx.fillStyle = '#17345f';
      ctx.font = '800 ' + titleSize + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(String(code || (item && item.display) || ''), imageX, titleY);

      ctx.fillStyle = '#64748b';
      ctx.font = '500 ' + bodySize + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
      let bodyY = titleY + bodyTopGap + bodySize;
      bodyLines.forEach((line) => {
        if (line.startsWith('下单货号：')) ctx.fillStyle = '#b45f06';
        else if (line.startsWith('给工厂备注：')) ctx.fillStyle = '#1d4ed8';
        else ctx.fillStyle = '#334155';
        ctx.fillText(line, imageX, bodyY);
        bodyY += bodyLineHeight;
      });

      ctx.fillStyle = '#94a3b8';
      ctx.font = '500 24px "Microsoft YaHei", "PingFang SC", sans-serif';
      ctx.fillText('销售排行 · 工厂补货单', imageX, cardY + cardH - pad + 4);

      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('order card image failed'));
        }, 'image/png');
      });
    }

    function escapeClipboardHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

        const drawH = image.naturalHeight * scale;

        ctx.fillText('商品图片暂时无法加载', size / 2, size / 2 + 52);

      const blob = await new Promise((resolve, reject) => {

    function buildOrderRichHtml(code, text) {
      const item = allItems.find((candidate) =>
        String(candidate.code || '').trim() === String(code || '').trim()) || null;
      const codeText = escapeClipboardHtml(code);

        if (imageSrc) imageSrc = new URL(imageSrc, location.href).href;
      } catch (error) {
        // 图片地址异常时保留原值，避免整次复制失败。
      }
      const imageHtml = imageSrc
        ? '<div style="margin:0 0 12px">' +
            '<img src="' + escapeClipboardHtml(imageSrc) + '" alt="' + codeText +
              '" style="display:block;width:100%;max-width:480px;height:auto;border-radius:14px">' +
          '</div>'
        : '';
      return (
        '<div style="font-family:-apple-system,BlinkMacSystemFont,\'Microsoft YaHei\',sans-serif;color:#172b49">' +
          imageHtml +
          '<div style="font-size:17px;line-height:1.7;white-space:pre-wrap">' + bodyText + '</div>' +
        '</div>'
      );
    }

    function copyOrderRichHtmlToClipboard(code, text) {
      const source = document.createElement('div');
      source.style.cssText =
        'position:fixed;left:-10000px;top:0;width:520px;white-space:normal;' +
        'font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;color:#172b49';
      source.innerHTML = buildOrderRichHtml(code, text);
      document.body.appendChild(source);

      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(source);
      selection.removeAllRanges();
      selection.addRange(range);
      let copied = false;
      try {
        copied = document.execCommand('copy');
      } finally {
        selection.removeAllRanges();
        source.remove();
      }
      return copied;
    }

    async function buildOrderRichContent(code, text) {
      const image = await buildProductMessageImage(code);
      return {
        imageBlob: image.blob,
        html: buildOrderRichHtml(code, text),
      };
    }

    async function copyOrderCardToClipboard(code, text) {
      try {
        if (copyOrderRichHtmlToClipboard(code, text)) return 'richHtml';
      } catch (error) {
        // Clipboard API 作为兼容兜底。
      }
      if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
        try {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([buildOrderRichHtml(code, text)], { type: 'text/html' }),
              'text/plain': new Blob([text], { type: 'text/plain' }),
            }),
          ]);
          return 'richHtml';
        } catch (error) {
          // 个别浏览器不支持只写 HTML，继续使用图片与文字双格式。
        }
        const richPromise = buildOrderRichContent(code, text);
        try {
          await navigator.clipboard.write([
            new ClipboardItem({
              'image/png': richPromise.then((content) => content.imageBlob),
              'text/plain': new Blob([text], { type: 'text/plain' }),
            }),
          ]);
          return 'imageText';
        } catch (error) {
          // 再退回单张图片。
        }
        const blobPromise = buildOrderCardBlob(code, text);
        try {
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blobPromise }),
          ]);
          return 'image';
        } catch (error) {
          // 某些手机浏览器不支持复制图片，保留纯文字兜底。
        }
        await blobPromise.catch(() => null);
      }
      await copyTextToClipboard(text);
      return 'text';
    }

    function copyPlan(item) {
      const picks = [...$('sheet').querySelectorAll('.plan-input')]
        .map((input) => ({ s: input.dataset.size, plan: Math.max(0, Math.round(num(input.value))) }))
        .filter((size) => size.plan > 0);
      const total = picks.reduce((sum, size) => sum + size.plan, 0);
      if (!total) {
        showToast('请先填写补单数量');
        return;
      }
      const note = String($('note') && $('note').value || '').trim();
      const lines = [new Date().toLocaleDateString('zh-CN')];
      if (note) lines.push('给工厂备注：' + note);
      lines.push('下单货号：' + item.code + '（合计 ' + fmtInt(total) + '双）');
      picks.forEach((size) => lines.push(size.s + '码 ' + fmtInt(size.plan) + '双'));
      const text = lines.join('\n');
      const showOrderedAfterCopy = () => {
        closeDetail();
        $('q').value = '';
        selectFilter('ordered');
        applyFilter();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      const done = async (copyMode) => {
        let savedToServer = true;
        try {
          await saveOrderRecord(item.code, total, {
            text,
            note,
            sizes: picks.map((size) => ({ s: size.s, q: size.plan })),
          });
        } catch (error) {
          savedToServer = false;
        }
        showOrderedAfterCopy();
        const copied = copyMode === 'richHtml' || copyMode === 'rich' || copyMode === 'imageText'
          ? '已复制图片和文字'
          : (copyMode === 'image'
            ? '当前浏览器不支持图文同粘，已复制商品图'
            : '已复制补货文字');
        showToast(copied + (!syncEnabled
          ? '并记录到本机 ' + fmtInt(total) + ' 双'
          : (savedToServer
            ? '并记录工厂下单 ' + fmtInt(total) + ' 双'
            : '并记录到本机，服务器同步暂失败')));
      };
      const failed = () => showToast('复制失败，请长按备注手动复制');
      copyOrderCardToClipboard(item.code, text).then(done, failed);
    }

    let toastTimer = null;
    function showToast(message, duration = 1800) {
      const toast = $('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    function restockAgeMs(restock) {
      const stamp = Number(restock && restock.updated_ts);
      if (stamp > 0) return Math.max(0, Date.now() - stamp * 1000);
      // 兼容后端刚重启、还没有 updated_ts 的短窗口：解析「11-14 16:41」。
      const match = String(restock && restock.updated || '').match(/^(\d{2})-(\d{2})\s+(\d{2}):(\d{2})$/);
      if (!match) return Infinity;
      const now = new Date();
      const at = new Date(now.getFullYear(), Number(match[1]) - 1, Number(match[2]),
        Number(match[3]), Number(match[4]), 0, 0);
      if (at.getTime() > now.getTime() + 86400000) at.setFullYear(at.getFullYear() - 1);
      return Math.max(0, Date.now() - at.getTime());
    }

    function renderDashboard(data, manual = false) {
      const sr = data && data.details && data.details.sales_rank;
      if (!sr) throw new Error('接口没有销售排行数据');
      latestDashboard = data;
      const restock = data.details.restock || {};
      const today = sr.today || {};
      const source = data.__dashboardSource || (STATIC_SNAPSHOT ? 'snapshot' : 'local');
      lastDashboardStatus = (source === 'live' ? '实时 ' : (source === 'local' ? '库存 ' : '快照 ')) + (restock.updated || '—') +
        ' · 今日 ¥' + fmtInt(today.amount) + ' / ' + fmtInt(today.orders) + ' 单';
      $('updated').textContent = lastDashboardStatus;
      const signature = [
        source,
        data.updated_at || '',
        restock.updated_ts || '',
        restock.updated || '',
        restock.seq || '',
        restock.inventory_seq || '',
        restock.archive_seq || '',
        today.updated || '',
        today.amount || '',
        today.orders || '',
        Array.isArray(sr.rows) ? sr.rows.length : 0,
        JSON.stringify(orderRecords),
      ].join('|');
      if (!manual && allItems.length && signature === lastRenderSignature) return;
      const parsed = parseItems(sr, restock);
      allItems = parsed.items;
      defaultSortNote = parsed.hiddenNamedNorestock
        ? '已过滤未备货 ' + parsed.hiddenNamedNorestock + ' 款'
        : '按桌面版销售排行顺序';
      lastRenderSignature = signature;
      applyFilter();
    }

    async function fetchDashboard() {
      const live = STATIC_SNAPSHOT && syncEnabled;
      const source = STATIC_SNAPSHOT ? (live ? 'live' : 'snapshot') : 'local';
      const url = live ? serviceUrl(LIVE_DASHBOARD_API) : API;
      try {
        const response = await fetchWithTimeout(url, { cache: 'no-store' }, 12000);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        data.__dashboardSource = source;
        return data;
      } catch (error) {
        if (!live) throw error;
        // 公网实时通道偶尔会切换地址或短暂断线；先用随页面发布的快照兜底，
        // 下一轮自动刷新或手动刷新会重新解析 GitHub 里的最新通道地址。
        syncEnabled = false;
        apiBase = '';
        const fallback = await fetch(API, { cache: 'no-store' });
        if (!fallback.ok) throw error;
        const data = await fallback.json();
        data.__dashboardSource = 'snapshot';
        return data;
      }
    }

    async function finishInventorySync(beforeAttempt, beforeInventory, manual) {
      try {
        let data = null;
        const deadline = Date.now() + 180000;
        while (Date.now() < deadline) {
          await new Promise((resolve) => setTimeout(resolve, 1500));
          data = await fetchDashboard();
          const restock = data && data.details && data.details.restock || {};
          if (!restock.running && num(restock.inventory_attempt_seq) > beforeAttempt) break;
        }
        if (!data) throw new Error('等待库存同步超时');
        const restock = data.details.restock || {};
        if (num(restock.inventory_attempt_seq) <= beforeAttempt) throw new Error('库存同步超时');
        if (num(restock.inventory_seq) <= beforeInventory) {
          throw new Error(restock.last_error || '库存同步失败');
        }
        renderDashboard(data, manual);
        if (manual) showToast('库存已更新', 1100);
      } catch (error) {
        $('updated').textContent = '后台库存更新失败：' + error.message;
        if (manual) showToast('库存更新失败：' + error.message);
      } finally {
        inventorySyncing = false;
        $('refresh').disabled = false;
      }
    }

    async function syncInventory(manual = false) {
      if (STATIC_SNAPSHOT) {
        if (!syncEnabled || manual) await resolveSyncBase(true);
        if (syncEnabled) {
          if (manual) showToast('正在读取后台最新数据', 900);
          await loadData(manual);
        } else {
          showToast('实时通道暂时不可用，当前显示最新快照', 2400);
        }
        return;
      }
      if (inventorySyncing) {
        if (manual) showToast('后台正在更新，完成后会自动刷新', 900);
        return;
      }
      inventorySyncing = true;
      $('refresh').disabled = true;
      const before = latestDashboard && latestDashboard.details && latestDashboard.details.restock || {};
      const beforeAttempt = num(before.inventory_attempt_seq);
      const beforeInventory = num(before.inventory_seq);
      if (manual) {
        $('updated').textContent = '刷新已提交，后台更新中';
        showToast('刷新已提交，完成自动更新', 900);
        setTimeout(() => {
          if (inventorySyncing && $('updated').textContent === '刷新已提交，后台更新中') {
            $('updated').textContent = lastDashboardStatus;
          }
        }, 900);
      }
      let started = false;
      try {
        const response = await fetch(serviceUrl(REFRESH_API), { method: 'POST', cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const result = await response.json();
        if (result && result.success === false) throw new Error(result.msg || '无法开始同步');
        started = true;
      } catch (error) {
        inventorySyncing = false;
        $('updated').textContent = '库存同步失败：' + error.message;
        if (manual) showToast('库存同步失败：' + error.message);
      } finally {
        $('refresh').disabled = false;
        $('cards').classList.remove('loading');
      }
      if (started) void finishInventorySync(beforeAttempt, beforeInventory, manual);
    }

    async function loadData(manual = false, reconnect = false) {
      if (loading || inventorySyncing) return;
      loading = true;
      $('refresh').disabled = true;
      $('updated').textContent = manual ? '正在刷新…' : $('updated').textContent;
      try {
        if (reconnect && STATIC_SNAPSHOT && !syncEnabled) {
          $('updated').textContent = '正在重新连接实时库存…';
          await resolveSyncBase(true);
        }
        const [data] = await Promise.all([fetchDashboard(), fetchOrderRecords(), fetchRestockNotes()]);
        renderDashboard(data, manual);
        if (currentCode && syncEnabled && orderEntriesOf(currentCode).length) {
          void fetchRestockArrivalProgress(currentCode);
        }
        const restock = data && data.details && data.details.restock;
        if (!STATIC_SNAPSHOT &&
            restockAgeMs(restock) > AUTO_SYNC_STALE_MS &&
            Date.now() - lastAutoSyncAttempt > AUTO_SYNC_COOLDOWN_MS) {
          lastAutoSyncAttempt = Date.now();
          setTimeout(() => syncInventory(false), 0);
        }
      } catch (error) {
        $('updated').textContent = '读取失败：' + error.message;
        if (!allItems.length) {
          $('cards').innerHTML = '<div class="empty"><div class="big">⚠️</div>暂时读不到销售排行数据<br><small>请确认 8123 售后数据服务正在运行</small></div>';
        }
      } finally {
        loading = false;
        $('refresh').disabled = false;
        $('cards').classList.remove('loading');
      }
    }

    $('q').addEventListener('input', applyFilter);
    $('clear').addEventListener('click', () => {
      $('q').value = '';
      $('q').focus();
      applyFilter();
    });
    $('filters').addEventListener('click', (event) => {
      const button = event.target.closest('[data-filter]');
      if (!button) return;
      selectFilter(button.dataset.filter);
      applyFilter();
    });
    $('cards').addEventListener('click', (event) => {
      const card = event.target.closest('.sr-card');
      if (card) openDetail(card.dataset.code);
    });
    $('cards').addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const card = event.target.closest('.sr-card');
      if (!card) return;
      event.preventDefault();
      openDetail(card.dataset.code);
    });
    $('sheet').addEventListener('click', (event) => {
      if (event.target.closest('[data-close]')) closeDetail();
    });
    $('sheetWrap').addEventListener('click', (event) => {
      if (event.target === $('sheetWrap')) closeDetail();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && $('sheetWrap').classList.contains('open')) closeDetail();
    });
    $('refresh').addEventListener('click', () => syncInventory(true));
    $('loadMore').addEventListener('click', () => {
      visibleLimit += PAGE_SIZE;
      renderCards();
    });
    window.addEventListener('pageshow', () => {
      $('q').value = '';
      selectFilter('all');
      applyFilter();
    });

    const syncToTop = () => $('toTop').classList.toggle('show', window.scrollY > 900);
    window.addEventListener('scroll', syncToTop, { passive: true });
    $('toTop').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    syncToTop();

    (async () => {
      const snapshotLoad = loadData();
      const syncReady = resolveSyncBase();
      await Promise.all([snapshotLoad, syncReady]);
      if (STATIC_SNAPSHOT && syncEnabled) await loadData();
      setInterval(() => {
        if (!document.hidden) void loadData(false, true);
      }, AUTO_REFRESH_MS);
      window.addEventListener('online', () => {
        if (!document.hidden) void loadData(false, true);
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && STATIC_SNAPSHOT && !syncEnabled) void loadData(false, true);
      });
    })();
  </script>
</body>
